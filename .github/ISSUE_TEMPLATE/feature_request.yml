name: Feature request
description: Propose a focused product or engineering improvement
title: "[Enhancement]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or opportunity
      description: What user or engineering need should be addressed?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the desired behavior, alternatives and relevant capability area.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Note expected API, schema, security, compatibility or operational impact.

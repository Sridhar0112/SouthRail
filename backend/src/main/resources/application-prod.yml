spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT:5000}
  mail:
    username: ${SMTP_USERNAME:${MAIL_USERNAME:}}
    password: ${SMTP_PASSWORD:${MAIL_PASSWORD:}}

app:
  frontend-url: ${APP_FRONTEND_URL}
  jwt:
    issuer: ${JWT_ISSUER}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  mail:
    from: ${MAIL_FROM}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

management.endpoint.health.show-details: when_authorized
management.endpoint.health.show-components: when_authorized

logging:
  level:
    root: INFO
    com.southrail.reservation: INFO
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF

gemini:
  api-key: ${GEMINI_API_KEY:}
